loader_params:

    'train_bs': 1
    'val_bs': 1
    'csv_root': 'meta_data_colab_full.csv'
    'scale_dose_dict': 'meta_files/PTV_DICT.json'
    'pat_obj_dict': 'meta_files/Pat_Obj_DICT.json'
    'num_workers': 2

    'down_HU': -1000
    'up_HU': 1000
    'denom_norm_HU': 500

    'in_size': [64, 96, 112]
    'out_size': [64, 96, 112]

    'norm_oar': True
    'CatStructures': False
    'with_aug': False   # tr_augmentation's RandRotated (range_x=1 rad!) applied to ~46 channels
                         # was the real speed bottleneck -- 20+ min per item with zero
                         # batches completed. tt_augmentation (deterministic crop+pad+resize, no
                         # rotation) is far cheaper. Deadline-driven tradeoff: less augmentation
                         # diversity for actually finishing epochs. Re-enable (True) once time
                         # pressure is off.

    'dose_div_factor': 10


model_params:
    num_input_channels: 8
    out_channels: 1
    model_id: 'S'
    kernel_size: 3
    deep_supervision: False

save_model_root: 'runs/full_run'
lr: 0.0001

num_epochs: 50

act_sig: True

scale_out: 7.5
